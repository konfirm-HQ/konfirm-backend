<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Activity — Konfirm</title>
<style>
  :root {
    --ink: #0a0908; --surface: #17140f; --surface-2: #1e1a14;
    --border: #2b251c; --text-hi: #f5f3ee; --text-lo: #b6ada0; --text-faint: #8f8878;
    --accent: #c3a06a; --accent-ink: #1a1408; --success: #3a9c7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--ink); color: var(--text-hi);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 40px 20px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .brand .mark { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .nav { display: flex; align-items: center; gap: 14px; }
  .nav a, .nav button {
    font-size: 13px; color: var(--text-lo); text-decoration: none; background: none; border: none;
    cursor: pointer; font-family: inherit; padding: 0;
  }
  .nav a:hover, .nav button:hover { color: var(--text-hi); }
  h1 { font-size: 26px; margin: 4px 0 4px; }
  .sub { color: var(--text-lo); font-size: 14.5px; margin-bottom: 8px; }
  .balance { font-size: 46px; font-weight: 800; margin: 20px 0 36px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .balance small { font-size: 18px; font-weight: 500; color: var(--text-lo); }
  .empty { color: var(--text-faint); text-align: center; padding: 60px 0; font-size: 15px; }
  .payment {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 10px;
    animation: land 0.5s ease;
  }
  @keyframes land { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .payment .left { display: flex; align-items: center; gap: 12px; }
  .payment .tick { width: 30px; height: 30px; border-radius: 50%; background: var(--success); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none; }
  .payment .desc { font-size: 14px; }
  .payment .desc .from { color: var(--text-faint); font-size: 12.5px; }
  .payment .amount { font-weight: 700; font-variant-numeric: tabular-nums; }
  .live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--success); margin-bottom: 26px; }
  .live-dot span.d { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .waiting-banner {
    display: none;
    align-items: center; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 18px; font-size: 14px; color: var(--text-lo);
  }
  .waiting-banner.show { display: flex; }
  .waiting-banner .spin {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .waiting-banner .spin { animation: none; }
    .live-dot span.d { animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header-row">
      <div class="brand"><span class="mark">✓</span> Konfirm</div>
      <div class="nav" id="nav" style="display:none;">
        <a href="/new">+ New payment</a>
        <a href="/cashout">Cash out</a>
        <button type="button" id="logout-btn">Log out</button>
      </div>
    </div>
    <h1 id="merchant-heading">Your activity</h1>
    <p class="sub">Every payment below landed and was konfirmed on-chain — nothing here is an estimate.</p>
    <div class="live-dot"><span class="d"></span> Watching for new payments</div>
    <div class="waiting-banner" id="waiting-banner"><span class="spin"></span> A payment is on its way — konfirming on-chain now…</div>
    <div class="balance" id="balance">$0.00 <small>received</small></div>
    <div id="list"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const API_BASE = window.location.origin;
  const seen = new Set();
  let merchantAddress = params.get('merchant');

  // A ?merchant=G... in the URL still works (handy for support or a
  // one-off check), but the normal path is the logged-in session — no
  // address to remember or paste.
  async function resolveMerchant() {
    if (merchantAddress) return;
    const res = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
    if (!res.ok) {
      window.location.href = '/login';
      return;
    }
    const { merchant } = await res.json();
    merchantAddress = merchant.stellar_base_address;
    document.getElementById('merchant-heading').textContent = `${merchant.name}'s activity`;
    document.getElementById('nav').style.display = 'flex';
  }

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await fetch(`${API_BASE}/auth/logout`, { method: 'POST', credentials: 'include' });
    window.location.href = '/login';
  });

  async function poll() {
    if (!merchantAddress) {
      document.getElementById('list').innerHTML = '<div class="empty">No Stellar address on file yet.</div>';
      return;
    }
    const [paymentsRes, pendingRes] = await Promise.all([
      fetch(`${API_BASE}/payments/by-merchant/${merchantAddress}`),
      fetch(`${API_BASE}/payments/pending-by-merchant/${merchantAddress}`),
    ]);
    const payments = await paymentsRes.json();
    const pending = await pendingRes.json();
    const list = document.getElementById('list');

    document.getElementById('waiting-banner').classList.toggle('show', pending.pending);

    if (payments.length === 0) {
      list.innerHTML = pending.pending
        ? ''
        : '<div class="empty">No payments yet — this updates the instant one lands.</div>';
    }

    // Summed per asset — a $ total across mixed XLM and USDC payments would
    // just be adding two different currencies together and calling it money.
    const format = (amount, code) => (code === 'USDC' ? `$${amount.toFixed(2)}` : `${amount.toFixed(2)} ${code}`);
    const totals = {};
    payments.forEach((p) => { totals[p.asset_code] = (totals[p.asset_code] || 0) + Number(p.net_usdc); });
    const balanceHtml = Object.entries(totals)
      .map(([code, amount]) => `<div>${format(amount, code)} <small>received</small></div>`)
      .join('');
    document.getElementById('balance').innerHTML = balanceHtml || '$0.00 <small>received</small>';

    payments.forEach((p) => {
      if (seen.has(p.id)) return;
      seen.add(p.id);
      const row = document.createElement('div');
      row.className = 'payment';
      row.innerHTML = `
        <div class="left">
          <div class="tick">✓</div>
          <div class="desc">${p.link_description || 'Payment'}<div class="from">from ${p.payer_address.slice(0,4)}…${p.payer_address.slice(-4)}</div></div>
        </div>
        <div class="amount">${format(Number(p.net_usdc), p.asset_code)}</div>
      `;
      list.prepend(row);
    });

    setTimeout(poll, 3000);
  }

  resolveMerchant().then(poll);
</script>
</body>
</html>
