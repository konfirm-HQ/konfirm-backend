name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Postgres, not a mock — the same principle the test suite
    # itself follows (see README's Testing section).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: konfirm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/konfirm_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/konfirm_test
      JWT_SECRET: ci-only-secret-never-used-outside-this-workflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to the test database
        run: npm run migrate:up

      - name: Type check
        run: npx tsc --noEmit -p .

      # The critical-path e2e spec calls the real Stellar testnet Horizon
      # API and shells out to the `stellar` CLI for a compliance check. The
      # CLI isn't installed on this runner — that's fine by design: an
      # unreachable compliance check fails open with a logged warning
      # rather than failing the request (see payments.service.ts), so the
      # test still exercises everything else for real.
      - name: Run tests
        run: npm test

      # A high-severity finding fails the build; moderate findings are
      # visible in the log without blocking every push on them.
      - name: Audit dependencies
        run: npm audit --audit-level=high
